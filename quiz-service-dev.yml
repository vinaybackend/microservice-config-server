spring:
  application:
    name: quiz-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: quizdb

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    function:
      definition: "information;informationConsumer"

    stream:
      bindings:
        information-out-0:
          destination: "information-exchange"
          content-type: "text/plain"

        informationConsumer-in-0:
          destination: "information-exchange"
          group: "quiz-consumer"
          content-type: "text/plain"

  config:
    value: "quiz-service,we are in dev after change"

server:
  port: 9092

eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
    register-with-eureka: true
    fetch-registry: true
    refresh:
      enable: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
